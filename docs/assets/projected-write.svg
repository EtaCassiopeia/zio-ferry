<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 440" width="918" height="440" role="img" aria-label="ProjectedWrite: a batch is committed to the key's log, which leaves the record's projection pending. The projection into the read-side view is refused until its retries run out, so the callers are answered Committed: durable, view pending. A sweeper finds the pending record, projects it, and the marker is cleared. A late projection of the old record is then refused by the fence, so nothing is projected twice.">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1222"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
  </linearGradient>
</defs>
