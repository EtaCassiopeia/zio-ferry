<svg width="960" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">Three kinds of drift between a model and its code</title>
  <desc id="d">Three panels comparing the model's steps (green) with the code's steps (blue). Code drift: the code split one step in two. Model drift: the model gained a guard the code lacks. Granularity drift: the model's one step is two steps in the code, with a gap between them.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2430; }
    .h { font-size: 19px; font-weight: 650; }
    .lab { font-size: 13px; fill: #6b7280; }
    .box { font-size: 15px; font-weight: 600; }
    .note { font-size: 14px; }
    .red { fill: #c2410c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  </style>
  <rect x="0" y="0" width="960" height="400" rx="14" fill="#fbfaf7"/>

  <!-- Panel separators -->
  <line x1="320" y1="24" x2="320" y2="376" stroke="#e5e2da" stroke-width="1.5"/>
  <line x1="640" y1="24" x2="640" y2="376" stroke="#e5e2da" stroke-width="1.5"/>

  <!-- ============ Panel 1: code drift ============ -->
  <text x="30" y="52" class="h">1. Code drift</text>
  <text x="30" y="98" class="lab">MODEL</text>
  <rect x="30" y="108" width="260" height="46" rx="8" fill="#e6f2ea" stroke="#2e8b57" stroke-width="2"/>
  <text x="160" y="137" class="box" text-anchor="middle">Take (take and own)</text>

  <text x="30" y="198" class="lab">CODE, AFTER A CHANGE</text>
  <rect x="30" y="208" width="124" height="46" rx="8" fill="#e8f0fa" stroke="#2f6db5" stroke-width="2"/>
  <text x="92" y="237" class="box" text-anchor="middle">Take</text>
  <rect x="166" y="208" width="124" height="46" rx="8" fill="#fdeee6" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="228" y="237" class="box red" text-anchor="middle">Own</text>

  <text x="30" y="300" class="note">The code split one transaction</text>
  <text x="30" y="320" class="note">in two. Tests still pass: the new</text>
  <text x="30" y="340" class="note">interleaving is rare. The model</text>
  <text x="30" y="360" class="note">verifies a protocol that is gone.</text>

  <!-- ============ Panel 2: model drift ============ -->
  <text x="350" y="52" class="h">2. Model drift</text>
  <text x="350" y="98" class="lab">MODEL, AFTER A "SIMPLIFICATION"</text>
  <rect x="350" y="108" width="260" height="46" rx="8" fill="#e6f2ea" stroke="#2e8b57" stroke-width="2"/>
  <text x="420" y="137" class="box" text-anchor="middle">Take</text>
  <rect x="486" y="116" width="114" height="30" rx="6" fill="#fdeee6" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="543" y="136" class="mono red" text-anchor="middle">+ full lane</text>

  <text x="350" y="198" class="lab">CODE</text>
  <rect x="350" y="208" width="260" height="46" rx="8" fill="#e8f0fa" stroke="#2f6db5" stroke-width="2"/>
  <text x="480" y="237" class="box" text-anchor="middle">Take (partial batches too)</text>

  <text x="350" y="300" class="note">The model gained a guard the</text>
  <text x="350" y="320" class="note">code never had. TLC is happier:</text>
  <text x="350" y="340" class="note">the model got stronger. It proves</text>
  <text x="350" y="360" class="note">things about a system nobody built.</text>

  <!-- ============ Panel 3: granularity drift ============ -->
  <text x="670" y="52" class="h">3. Granularity drift</text>
  <text x="670" y="98" class="lab">MODEL</text>
  <rect x="670" y="108" width="260" height="46" rx="8" fill="#e6f2ea" stroke="#2e8b57" stroke-width="2"/>
  <text x="800" y="137" class="box" text-anchor="middle">Fill (one action)</text>

  <text x="670" y="198" class="lab">CODE: UNINTERRUPTIBLE, NOT ATOMIC</text>
  <rect x="664" y="203" width="272" height="56" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="670" y="208" width="112" height="46" rx="8" fill="#e8f0fa" stroke="#2f6db5" stroke-width="2"/>
  <text x="726" y="236" class="mono" text-anchor="middle">takeUpTo</text>
  <rect x="818" y="208" width="112" height="46" rx="8" fill="#e8f0fa" stroke="#2f6db5" stroke-width="2"/>
  <text x="874" y="236" class="mono" text-anchor="middle">taken.update</text>
  <!-- the gap -->
  <line x1="800" y1="206" x2="800" y2="268" stroke="#c2410c" stroke-width="2.5"/>
  <path d="M792 276 L800 266 L808 276" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <text x="800" y="292" class="note red" text-anchor="middle">other fibers can run here</text>

  <text x="670" y="320" class="note">Nobody changed anything. The</text>
  <text x="670" y="340" class="note">model's step is just bigger than</text>
  <text x="670" y="360" class="note">the code's. Sound? Ask whoever</text>
  <text x="670" y="380" class="note">remembers the argument.</text>
</svg>
