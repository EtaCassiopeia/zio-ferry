site_name: Ferry
site_description: A ZIO 2 micro-batching bulkhead with per-key ordering, verified by simulation and model checking.
site_url: https://etacassiopeia.github.io/zio-ferry/
repo_url: https://github.com/EtaCassiopeia/zio-ferry
repo_name: EtaCassiopeia/zio-ferry
edit_uri: edit/main/docs/
copyright: Apache License 2.0
strict: true

theme:
  name: material
  logo: assets/logo-mark.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Code samples are included from compiled sources, so they cannot drift from the API.
  - pymdownx.snippets:
      base_path: [examples/src/main/scala/ferry/examples]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Batching calls: guide/batching.md
      - Per-key batching: guide/per-key.md
      - Dispatch order: guide/ordering.md
      - Fenced writes with FoldWrite: guide/fold-write.md
      - Commit, then project: guide/projected-write.md
      - Errors and lifecycle: guide/errors-and-lifecycle.md
      - Configuration and tuning: guide/configuration.md
  - Architecture:
      - architecture/index.md
      - Ferry.make: architecture/single-queue.md
      - Ferry.perKey: architecture/per-key.md
      - Running on a fleet: architecture/fleet.md
  - Verification: verification.md
  - Design:
      - Decision records:
          - decisions/README.md
          - 0001 Single-queue batcher: decisions/0001-single-queue-batcher.md
          - 0002 Layered verification: decisions/0002-layered-verification.md
          - 0003 Per-key batching: decisions/0003-per-key-batching.md
          - 0004 Dispatch on completion: decisions/0004-dispatch-on-completion.md
          - 0005 Fenced single writer: decisions/0005-fenced-single-writer.md
          - 0006 Per-input outcomes: decisions/0006-per-input-outcomes.md
          - 0007 Bound by weight: decisions/0007-bound-by-weight.md
          - 0008 Deferred: decisions/0008-deferred.md
          - 0009 Drop mutation testing: decisions/0009-drop-mutation-testing.md
          - 0010 Direct calls for idle keys: decisions/0010-direct-calls-for-idle-keys.md
          - 0011 Pluggable dispatch order: decisions/0011-pluggable-dispatch-order.md
          - 0012 FoldWrite: decisions/0012-fold-write-helper.md
          - 0013 Rename to Ferry: decisions/0013-rename-to-ferry.md
          - 0014 Commit, then project: decisions/0014-commit-then-project.md
      - "Proposal: ordering, lateness, grouping": design/ordering.md
  - API reference: https://etacassiopeia.github.io/zio-ferry/api/
  - Development: development.md
