\* A caller joins its lane apart from the check that admission is open. Expected: NoneStrandedAfterClose is violated.
CONSTANTS
  Callers = {c1, c2}
  Keys = {k1}
  Workers = {w1, w2}
  MaxBatch = 2
  MaxWeight = 3
  MaxQueue = 3
  MaxQueuedWeight = 4
  Direct = FALSE
  OneCallPerKey = TRUE
  Sorted = TRUE
  BusyGuard = TRUE
  DirectGuard = TRUE
  AtomicAdmission = FALSE
  DrainOnClose = TRUE
  LowRank = {}
  Heavy = {}
  RankOf <- MCRank
  WeightOf <- MCWeight

SPECIFICATION Spec
INVARIANTS TypeOK NoneStrandedAfterClose

