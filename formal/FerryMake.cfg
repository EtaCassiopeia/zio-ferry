\* Ferry.make as implemented: one key, batches of it may run concurrently. Expected: no error.
CONSTANTS
  Callers = {c1, c2, c3}
  Keys = {k1}
  Workers = {w1, w2}
  MaxBatch = 2
  MaxWeight = 3
  MaxQueue = 3
  MaxQueuedWeight = 4
  Direct = FALSE
  OneCallPerKey = FALSE
  Sorted = TRUE
  BusyGuard = TRUE
  DirectGuard = TRUE
  AtomicAdmission = TRUE
  DrainOnClose = TRUE
  LowRank = {}
  Heavy = {}
  RankOf <- MCRank
  WeightOf <- MCWeight

SPECIFICATION Spec
INVARIANTS TypeOK Safety
PROPERTIES EveryCallerAnswered
