\* A clear that does not wait for every row clears the marker with a refused row missing. Expected: MarkerHonest violated.
CONSTANTS
  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxFaults = 2
  MaxGiveUps = 1
  ConditionalRows = TRUE
  ClearWhenComplete = FALSE
  FencedClear = TRUE
  Resume = TRUE

SPECIFICATION Spec
CONSTRAINT RowBound
INVARIANTS TypeOK AtMostOnce RowsAtMostOnce RowsFromLog MarkerHonest AnswersTruthful ProjectedInView

