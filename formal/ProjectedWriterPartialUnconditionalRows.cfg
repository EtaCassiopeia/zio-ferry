\* Rows written unconditionally: a node's row and the sweeper's both land. Expected: RowsAtMostOnce violated.
CONSTANTS
  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxFaults = 2
  MaxGiveUps = 1
  ConditionalRows = FALSE
  ClearWhenComplete = TRUE
  FencedClear = TRUE
  Resume = TRUE

SPECIFICATION Spec
CONSTRAINT RowBound
INVARIANTS TypeOK AtMostOnce RowsAtMostOnce RowsFromLog MarkerHonest AnswersTruthful ProjectedInView

