  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxLost = 1
  MaxGiveUps = 1
  FencedProject = TRUE
  Resume = FALSE
  EarlyAnswer = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK Safety
PROPERTIES EventuallyProjected
