\* A key is claimed for a direct call even when it is not idle. Expected: OneInFlightPerKey is violated.
CONSTANTS
  Callers = {c1, c2}
  Keys = {k1}
  Workers = {w1, w2}
  MaxBatch = 2
  MaxWeight = 3
  MaxQueue = 3
  MaxQueuedWeight = 4
  Direct = TRUE
  OneCallPerKey = TRUE
  Sorted = TRUE
  BusyGuard = TRUE
  DirectGuard = FALSE
  AtomicAdmission = TRUE
  DrainOnClose = TRUE
  LowRank = {}
  Heavy = {}
  RankOf <- MCRank
  WeightOf <- MCWeight

SPECIFICATION Spec
INVARIANTS TypeOK OneInFlightPerKey

