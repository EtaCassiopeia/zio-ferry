\* An unfenced clear, made at log length 1, lands after a commit took the log to 2. Expected: MarkerHonest violated.
CONSTANTS
  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxFaults = 2
  MaxGiveUps = 1
  ConditionalRows = TRUE
  ClearWhenComplete = TRUE
  FencedClear = FALSE
  Resume = TRUE

SPECIFICATION Spec
CONSTRAINT RowBound
INVARIANTS TypeOK AtMostOnce RowsAtMostOnce RowsFromLog MarkerHonest AnswersTruthful ProjectedInView

