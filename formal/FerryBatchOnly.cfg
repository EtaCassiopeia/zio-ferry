\* Ferry.perKey as implemented, with direct calls off or a delay: every input is batched. Expected: no error.
CONSTANTS
  Callers = {c1, c2, c3}
  Keys = {k1, k2}
  Workers = {w1, w2}
  MaxBatch = 2
  MaxWeight = 3
  MaxQueue = 2
  MaxQueuedWeight = 4
  Direct = FALSE
  OneCallPerKey = TRUE
  Sorted = TRUE
  BusyGuard = TRUE
  DirectGuard = TRUE
  AtomicAdmission = TRUE
  DrainOnClose = TRUE
  LowRank = {c2}
  Heavy = {c3}
  RankOf <- MCRank
  WeightOf <- MCWeight

SPECIFICATION Spec
INVARIANTS TypeOK Safety
PROPERTIES EveryCallerAnswered CancelledNeverSent FirstComeFirstServed
