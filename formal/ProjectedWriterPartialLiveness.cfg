\* The writer as recommended, for liveness: every committed entry is eventually projected. One fault, and no view,
\* so that liveness checking sees every state. Expected: no error.
CONSTANTS
  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxFaults = 1
  MaxGiveUps = 1
  ConditionalRows = TRUE
  ClearWhenComplete = TRUE
  FencedClear = TRUE
  Resume = TRUE

SPECIFICATION Spec
CONSTRAINT RowBound
INVARIANTS TypeOK
PROPERTIES EventuallyProjected
