\* A busy key's lane is not blocked. Expected: OneInFlightPerKey is violated.
CONSTANTS
  Callers = {c1, c2, c3}
  Keys = {k1}
  Workers = {w1, w2}
  MaxBatch = 2
  MaxWeight = 3
  MaxQueue = 3
  MaxQueuedWeight = 4
  Direct = FALSE
  OneCallPerKey = TRUE
  Sorted = TRUE
  BusyGuard = FALSE
  DirectGuard = TRUE
  AtomicAdmission = TRUE
  DrainOnClose = TRUE
  LowRank = {}
  Heavy = {}
  RankOf <- MCRank
  WeightOf <- MCWeight

SPECIFICATION Spec
INVARIANTS TypeOK OneInFlightPerKey

