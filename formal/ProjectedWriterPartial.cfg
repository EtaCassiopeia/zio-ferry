\* The writer as recommended: idempotent rows, a clear that waits for every row and is fenced, resume and a sweeper. Expected: no error.
CONSTANTS
  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxFaults = 2
  MaxGiveUps = 1
  ConditionalRows = TRUE
  ClearWhenComplete = TRUE
  FencedClear = TRUE
  Resume = TRUE

SPECIFICATION Spec
CONSTRAINT RowBound
INVARIANTS TypeOK Safety
PROPERTIES EventuallyProjected
