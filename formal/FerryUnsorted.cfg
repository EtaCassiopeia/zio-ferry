\* Inputs join the back of their lane. Expected: InOrderPerKey is violated.
CONSTANTS
  Callers = {c1, c2, c3}
  Keys = {k1}
  Workers = {w1, w2}
  MaxBatch = 2
  MaxWeight = 3
  MaxQueue = 3
  MaxQueuedWeight = 4
  Direct = FALSE
  OneCallPerKey = TRUE
  Sorted = FALSE
  BusyGuard = TRUE
  DirectGuard = TRUE
  AtomicAdmission = TRUE
  DrainOnClose = TRUE
  LowRank = {c2}
  Heavy = {}
  RankOf <- MCRank
  WeightOf <- MCWeight

SPECIFICATION Spec
INVARIANTS TypeOK InOrderPerKey

